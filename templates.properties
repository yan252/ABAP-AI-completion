# ============================================================================
# Template menu configuration (ABAP AI Completion plugin)
# ----------------------------------------------------------------------------
# Maps each "Templates" sub-menu item to its abapGit offline repository zip.
#
# Format (one entry per line):
#   <menu label>=<zip file name under the references/ folder>
#
# To add a new template menu:
#   1. Put your offline-repo zip into the "references/" folder;
#   2. Add one line below:  My New Template=ZTEMPLATE11.zip
#   3. Rebuild/redeploy the plugin. The new menu item appears automatically.
#
# Lines starting with '#' or blank lines are ignored.
# ============================================================================

Simple Query Handler Template=ZTEMPLATE10.zip
