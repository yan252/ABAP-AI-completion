sapPage.description=配置“测试连接”与模板导入所使用的 abapGit（abap-cli）连接。请填写 abap-cli URL，以及连接 ABAP 系统时所需的客户端 / 用户 / 密码 / 语言等参数。\n\n注意：“测试连接”使用页面顶部的 abap-cli URL，并按 abapGit（abap-cli）方式逐层探测（tls / auth / adt），不依赖 ~/.abap-cli/systems.json 中的 profile。\n\n范围：本页配置的 SAP 连接仅用于“Templates”菜单下的功能（如 SAP 连接配置、模板导入），不影响 AI 代码补全或插件的其他功能。
