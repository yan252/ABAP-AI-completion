autoPage.note.delay=停止输入后等待多长时间再由 AI 给出代码建议。\n当光标前的文本为空/仅含空格，或以已激活的触发字符结尾时，触发自动补全。\n建议值：1500-3000 毫秒。值越小，对 API 的请求越频繁。
autoPage.note.manualKey=手动触发快捷键：Ctrl+Shift+.\n修改此快捷键：窗口 > 首选项 > 常规 > 键\n搜索 'ABAP AI 补全'
autoPage.note.triggerChars=三列分别为：触发字符（可包含空格，但不能全为空格）、\n激活（仅激活的字符会触发补全，默认全部激活）以及\n功能描述。\n当光标前的文本为空/仅含空格，或以已激活的触发字符结尾时，经过延迟后触发自动补全。使用“添加/移除”维护该列表。
