mainPage.note.displayType=AI 补全代码的显示方式。\n1 - 对话框显示：在浮动弹出窗口中显示代码（默认）。\n2 - 内联显示：在光标位置显示幽灵文本而不实际插入；按 TAB 或 Enter 接受，按其他任意键取消。
mainPage.note.recentlyModified=ABAP 对象（程序、类等）保存成功后，自动记录到 Project Explorer 中对应系统的\n「最近修改」节点，最近修改的排在最前面。列表保存在本地（每个项目保留的对象数量\n可在「SAP 扩展」页配置），不依赖后端系统支持。
recent.node.name=最近修改
mainPage.note.language=更改语言并保存后会询问是否重启 Eclipse，以完全切换所有插件文字。\n新打开的对话框与配置页会立即使用新语言。
mainPage.note.logging=0 = 不记录日志；1 = 记录接口请求/响应日志；2 = 额外记录 DEBUG 日志（解析器、上下文收集等）。\n日志写入插件状态目录，而非 Eclipse 错误日志。\n确切路径见 AILogger，位于 <workspace>/.metadata/.plugins/ 下。
mainPage.note.opacity=AI 补全覆盖层窗口的不透明度。\n数值越小越透明。范围：10-100%。
mainPage.note.parent=父程序查找会搜索包含 INCLUDE <当前文件> 的 ABAP 文件。\n搜索深度为 0 表示禁用父程序查找，仅发送当前文件的代码。
mainPage.note.skill=该目录包含若干 skill 子目录。\n每个子目录即为一个 skill，内含 SKILL.md 及参考文件（.abap、.txt、.md 等）。\nSkill 文件按代码类型（ABAP/CDS）筛选。\n留空则使用默认路径：<workspace>/.metadata/.plugins/com.sap.abap.ai.completion/skills
mainPage.note.workspace=工作区代码参考会将工作区中的其他 ABAP 文件作为 AI 上下文发送。
mainPage.restart.question=插件语言已更改。\n\n是否立即重启 Eclipse，将所有插件文字切换为所选语言？\n若重启后个别启动时创建的文字未切换，请完全退出 Eclipse 并重新启动一次。
