extPage.title=SAP Extensions
extPage.description=Configure SAP-related extension features.
extPage.group.recentlyModified=Recently Modified
extPage.label.maxEntries=Max recently modified objects\:
extPage.note.recentlyModified=Maximum number of recently modified objects kept per project under the\n"Recently Modified" node in the Project Explorer. When a saved object is added and the total\nexceeds this number, the oldest objects are removed so the node never holds more entries.\nDefault\: 10. Applies to newly saved objects immediately.
extPage.error.maxEntriesPositive=Max recently modified objects must be a positive integer.
trigger.default.1=Instance component selector\: suggests attributes or methods of an instance
trigger.default.2=Static component selector\: accesses static members of a class or interface
trigger.default.3=Interface component selector\: accesses methods or attributes of an interface
trigger.default.4=Chained statement colon\: suggests field list/parameters after WRITE\:, DATA\:
trigger.default.5=Opening parenthesis\: suggests parameters of function/method calls
trigger.default.6=Opening bracket\: suggests internal table index expression itab[ ... ]
trigger.default.7=Comma\: continues field list in SELECT, DATA declaration or parameter list
trigger.default.8=Double quote\: starts a line comment, suggests comment text
trigger.default.9=Assignment operator\: suggests right-hand operand, literal or expression
trigger.default.10=Down cast assignment operator\: suggests superclass reference or object
trigger.default.11=Not-equal comparison operator
trigger.default.12=Less-than comparison operator
trigger.default.13=Greater-than comparison operator
trigger.default.14=Less-than-or-equal comparison operator
trigger.default.15=Greater-than-or-equal comparison operator
trigger.default.16=Addition arithmetic operator
trigger.default.17=Subtraction arithmetic operator
trigger.default.18=Multiplication arithmetic operator
trigger.default.19=Division arithmetic operator
trigger.default.20=String concatenation operator (new syntax)
trigger.default.21=Declare a variable (requires trailing space)
trigger.default.22=Inline declaration with value assignment
trigger.default.23=Specify a data type (requires trailing space)
trigger.default.24=VALUE operator\: constructs complex data structures (requires trailing space)
trigger.default.25=CORRESPONDING\: structure assignment by component name (requires trailing space)
trigger.default.26=Constructor operator\: creates an object instance (requires trailing space)
trigger.default.27=Conversion operator\: type conversion (requires trailing space)
trigger.default.28=Query selection (requires trailing space)
trigger.default.29=Data source of a query (requires trailing space)
trigger.default.30=Query condition (requires trailing space)
