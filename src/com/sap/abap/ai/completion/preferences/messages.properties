sapPage.title=SAP Connection Config
sapPage.description=Configure the abapGit (abap-cli) connection used by "Test Connection" and the template import. Provide the abap-cli URL and, if required, the Client / User / Password / Language used to authenticate against the ABAP system.\n\nNote\: "Test Connection" uses the abap-cli URL at the top and probes it via the abapGit (abap-cli) approach (tls / auth / adt), without relying on ~/.abap-cli/systems.json profile.\n\nScope\: the SAP connection configured on this page only applies to the features under the "Templates" menu (e.g. SAP Connection Config, template import). It does not affect AI code completion or any other plugin features.
