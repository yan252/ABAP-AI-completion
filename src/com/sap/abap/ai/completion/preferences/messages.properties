sapPage.label.user=User\:
sapPage.label.password=Password\:
sapPage.button.download=Download abap-cli
sapPage.button.testConnection=Test Connection
sapPage.group.hints=Usage Hints
sapPage.note.hints=- Template import uses the abapGit (abap-cli) approach from the\n  stage directory (node abap-cli + prog-* extensions).\n- "Test Connection" uses the abap-cli URL at the top (e.g.\n  https\://s4devapp.sap.com.cn\:1443) and probes tls / auth / adt\n  without relying on ~/.abap-cli/systems.json.\n- Client / User / Password / Language are used for authentication against\n  the ABAP system when testing the abapGit (abap-cli) connection.
