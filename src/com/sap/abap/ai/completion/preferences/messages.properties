mainPage.title=ABAP AI Completion
mainPage.description=Configure AI-powered ABAP code completion.\nThe AI suggests code in a floating overlay (like Copilot).\nPress TAB to accept, any other key to dismiss.
mainPage.versionHeader=ABAP AI Completion  v{0}
mainPage.headerHint=Configure AI-powered ABAP code completion in the sections below.
mainPage.group.feature=Feature Settings
mainPage.checkbox.enablePlugin=Enable ABAP AI Completion plugin
mainPage.label.pluginLanguage=Plugin language:
mainPage.lang.zh=中文
mainPage.lang.en=English
mainPage.note.language=Changing the language and saving offers an Eclipse restart so all plugin texts switch completely.\nNewly opened dialogs and preference pages use the new language immediately.
mainPage.restart.title=Plugin Language Changed
mainPage.restart.question=The plugin language has been changed.\n\nRestart Eclipse now so that all plugin texts switch to the selected language?\nIf some texts created at startup are not switched after the restart, please fully exit Eclipse and start it again once more.
mainPage.group.skill=Skill Directory
mainPage.checkbox.enableSkill=Enable Skill reference for AI completion
mainPage.checkbox.recentlyModified=Add saved ABAP objects to the "Recently Modified" node
mainPage.note.recentlyModified=After an ABAP object (program, class, etc.) is saved it is recorded under the "Recently Modified"\nnode of its system in the Project Explorer, most recently modified first. The list is kept locally\n(the number of objects per project is configurable on the "SAP Extensions" page) and works\nregardless of backend support.
recent.node.name=Recently Modified
mainPage.label.skillDir=Skill directory\:
mainPage.button.browse=Browse...
mainPage.note.skill=This directory contains skill subdirectories.\nEach subdirectory is a skill with SKILL.md and reference files (.abap, .txt, .md, etc).\nSkill files are filtered by code type (ABAP/CDS).\nLeave empty to use default\: <workspace>/.metadata/.plugins/com.sap.abap.ai.completion/skills
mainPage.group.parent=Parent Program Resolution
mainPage.checkbox.enableParentResolution=Enable parent program reverse lookup
mainPage.label.searchDepth=ABAP search depth (levels)\:
mainPage.label.maxContextChars=Max context chars per parent\:
mainPage.note.parent=Parent lookup searches ABAP files containing INCLUDE <current file>.\nSearch depth 0 \= disable parent lookup, only current file code is sent.
mainPage.group.workspace=Workspace Code Reference Set
mainPage.checkbox.useWorkspace=Use workspace ABAP code as AI reference
mainPage.label.maxWorkspaceChars=Max workspace chars\:
mainPage.label.maxWorkspaceFiles=Max workspace files\:
mainPage.note.workspace=Workspace code reference sends other ABAP files from your workspace as AI context.
mainPage.group.logging=Interface Logging
mainPage.label.logLevel=Log level\:
mainPage.combo.logLevel0=0 - No logging
mainPage.combo.logLevel1=1 - Normal logging (interface request/response)
mainPage.combo.logLevel2=2 - DEBUG logging
mainPage.note.logging=0 \= No logging; 1 \= Record interface request/response logs; 2 \= Additionally record DEBUG logs (parser, context collection, etc.).\nLogs are written to the plugin state area, not the Eclipse error log.\nSee AILogger for the exact path under <workspace>/.metadata/.plugins/.
mainPage.group.prompt=Custom System Prompt
mainPage.group.style=Overlay Style
mainPage.label.color=Completion text color\:
mainPage.label.displayType=Completion display type\:
mainPage.combo.displayType1=1 - Dialog display (show in popup window)
mainPage.combo.displayType2=2 - Inline display (show at cursor, like Copilot)
mainPage.note.displayType=How AI completion code is shown.\n1 - Dialog display\: shows the code in a floating popup window (default).\n2 - Inline display\: shows ghost text at the cursor position without inserting; press TAB or Enter to accept, any other key cancels.
mainPage.label.opacity=Overlay opacity (%)\:
mainPage.note.opacity=Opacity of the AI completion overlay window.\nLower values \= more transparent. Range\: 10-100%.
mainPage.dialog.selectSkillDir.title=Select Skill Directory
mainPage.dialog.selectSkillDir.message=Select a directory containing .abap, .txt or .skill files\:
autoPage.title=AI Auto-Completion Settings
autoPage.description=Configure when AI code completion should be triggered automatically and maintain the trigger characters.
autoPage.checkbox.autoComplete=Auto-complete while typing
autoPage.label.delay=Delay after typing (ms)\:
autoPage.note.delay=How long to wait after you stop typing before AI suggests code.\nAuto-completion triggers when the text before the cursor is empty/spaces,\nor ends with an active Trigger Character.\nRecommended\: 1500-3000 ms. Lower values \= more requests to the API.
autoPage.note.manualKey=Manual trigger key\: Ctrl+Shift+.\nTo change this keybinding\: Window > Preferences > General > Keys\nSearch for 'ABAP AI completion'
autoPage.group.triggerChars=Trigger Characters
autoPage.column.triggerChar=Trigger Character
autoPage.column.active=Active
autoPage.column.description=Description
autoPage.button.add=Add
autoPage.button.remove=Remove
autoPage.newTriggerDesc=New trigger
autoPage.note.triggerChars=Three columns\: Trigger Character (may contain spaces, but not all-spaces),\nActive (only active characters trigger completion, all enabled by default), and\nDescription.\nAuto-completion triggers after the delay when the text before the cursor is empty/\nonly-spaces, or ends with an active trigger character. Add/Remove maintain the list.
autoPage.error.triggerCharEmpty=Trigger Character cannot be empty or contain only spaces.
autoPage.error.delayPositive=Delay after typing must be a positive integer.
