batchImport.prompt.transport=SAP 传输请求号（可选）。\n留空则让插件在目标包内自动创建新的 workbench 请求\n（推荐；S4DEV 需要 corrNr）。\n或输入一个已存在的未释放请求，例如 S4DK910369。
batchImport.progress.begin=正在导入 Batch Handler Templates\n包\: {0}   程序\: {1}   Stage\: {2}
