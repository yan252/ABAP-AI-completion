# --- BatchTemplateImportService ---
batchImport.dialog.title=Batch Import Handler Templates
batchImport.envFailedTitle=Batch Import Handler — 环境检查失败
batchImport.failedTitle=Batch Import Handler — 失败
batchImport.prompt.package=请输入目标 SAP 包（例如 ZDEV_PACKAGE 或 $TMP）。\n必须以 Z 或 Y 开头；允许 '/' 和 '$'；自动转为大写。
